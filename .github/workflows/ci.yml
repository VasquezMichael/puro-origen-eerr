name: Verificación

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas unitarias sin MongoDB
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Verificar espacios del diff
        run: git diff --check
