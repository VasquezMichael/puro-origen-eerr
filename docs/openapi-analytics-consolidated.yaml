openapi: 3.1.0
info:
  title: Dashboard y comparación consolidada EERR
  version: 1.0.0
  description: Consultas de solo lectura con simulación transitoria de margen; cálculo v3.
paths:
  /analytics/dashboard:
    get:
      summary: Dashboard mensual autorizado
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/year'
        - $ref: '#/components/parameters/month'
        - $ref: '#/components/parameters/targetNetMargin'
      responses:
        '200':
          description: Cobertura, sucursales y consolidado calculado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { description: Parámetros inválidos o límite de alcance excedido }
        '401': { description: Sesión inválida }
        '409': { description: Fuentes modificadas durante la lectura }
  /analytics/consolidated/compare:
    get:
      summary: Compara dos consolidados con el mismo margen transitorio
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/year'
        - $ref: '#/components/parameters/month'
        - $ref: '#/components/parameters/referenceYear'
        - $ref: '#/components/parameters/referenceMonth'
        - $ref: '#/components/parameters/targetNetMargin'
      responses:
        '200':
          description: Ambos períodos, cobertura, población, métricas financieras y objetivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsolidatedComparison' }
        '400': { description: Parámetros inválidos o límite de alcance excedido }
        '401': { description: Sesión inválida }
        '409': { description: Fuentes modificadas durante la lectura }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: eerr_session }
  parameters:
    year: { name: year, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 9999 } }
    month: { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
    referenceYear: { name: referenceYear, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 9999 } }
    referenceMonth: { name: referenceMonth, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
    targetNetMargin:
      name: targetNetMargin
      in: query
      required: false
      description: Fracción decimal transitoria; admite enteros como 0 y 1 y hasta cuatro decimales. Omisión equivale a 0.20; la respuesta usa cuatro decimales. Valores de al menos 1 producen TARGET_MARGIN_UNATTAINABLE aun con base incompleta.
      schema: { type: string, pattern: '^(?:0|[1-9]\d{0,2})(?:\.\d{1,4})?$', default: '0.20', example: '0.25' }
  schemas:
    Period:
      type: object
      required: [year, month]
      properties:
        year: { type: integer }
        month: { type: integer }
    Scope:
      type: object
      required: [type, authorizedCount, expectedCount, label]
      properties:
        type: { type: string, enum: [GLOBAL, ACCESSIBLE] }
        authorizedCount: { type: integer }
        expectedCount: { type: integer }
        label: { type: string }
    Coverage:
      type: object
      required: [expected, withEerr, withoutEerr, complete, partial, pending, empty, uninitialized, inactiveWithHistory, inactiveWithoutHistory, excludedNotStarted]
      properties:
        expected: { type: integer }
        withEerr: { type: integer }
        withoutEerr: { type: integer }
        complete: { type: integer }
        partial: { type: integer }
        pending: { type: integer }
        empty: { type: integer }
        uninitialized: { type: integer }
        inactiveWithHistory: { type: integer }
        inactiveWithoutHistory: { type: integer }
        excludedNotStarted: { type: integer }
    Metric:
      type: object
      required: [status, value, unit, reason]
      properties:
        status: { type: string, enum: [COMPLETE, BLOCKED, NOT_CALCULABLE] }
        value: { type: [string, 'null'], description: 'ARS con dos decimales o PERCENT con cuatro' }
        unit: { type: string, enum: [ARS, PERCENT] }
        reason:
          type: [string, 'null']
          enum: [null, UNINITIALIZED, PENDING_INPUTS, EMPTY_INPUT, ZERO_DENOMINATOR, ZERO_REVENUE, NON_POSITIVE_CONTRIBUTION_MARGIN, GOAL_NOT_CONFIGURED, TARGET_MARGIN_UNATTAINABLE, NON_POSITIVE_TARGET, INCOMPLETE_SCOPE, NO_COMPLETE_SOURCES]
    TrafficLight:
      type: object
      required: [status, value, reason]
      properties:
        status: { type: string, enum: [COMPLETE, BLOCKED, NOT_CALCULABLE] }
        value: { type: string, enum: [RED, YELLOW, GREEN, NEUTRAL] }
        reason: { type: [string, 'null'] }
    Consolidated:
      description: Contrato actual v3. En respuestas históricas v2 pueden faltar los campos de simulación y targetSales puede ser null; el cliente los presenta como no disponibles.
      type: object
      required: [status, definitive, includedCount, expectedCount, income, costs, expenses, grossMargin, grossMarginPercent, netResult, netResultPercent, breakEvenSales, targetNetMargin, targetSales, targetDifference, targetCompliance, trafficLight, label, breakEvenAssumption]
      properties:
        status: { type: string, enum: [COMPLETE, PARTIAL, PENDING, EMPTY] }
        definitive: { type: boolean }
        includedCount: { type: integer }
        expectedCount: { type: integer }
        income: { $ref: '#/components/schemas/Metric' }
        costs: { $ref: '#/components/schemas/Metric' }
        expenses: { $ref: '#/components/schemas/Metric' }
        grossMargin: { $ref: '#/components/schemas/Metric' }
        grossMarginPercent: { $ref: '#/components/schemas/Metric' }
        netResult: { $ref: '#/components/schemas/Metric' }
        netResultPercent: { $ref: '#/components/schemas/Metric' }
        breakEvenSales: { $ref: '#/components/schemas/Metric' }
        targetNetMargin: { type: string, pattern: '^(?:0|[1-9]\d*)\.\d{4}$', example: '0.2000' }
        targetSales: { $ref: '#/components/schemas/Metric' }
        targetDifference: { $ref: '#/components/schemas/Metric' }
        targetCompliance: { $ref: '#/components/schemas/Metric' }
        trafficLight: { $ref: '#/components/schemas/TrafficLight' }
        label: { type: string }
        breakEvenAssumption: { type: [string, 'null'] }
    Source:
      type: object
      required: [branchId, eerrId, revision]
      properties:
        branchId: { type: string }
        eerrId: { type: [string, 'null'] }
        revision: { type: [integer, 'null'] }
    Branch:
      type: object
      required: [branchId, name, active, temporal, eerrId, revision, loadStatus, analysisStatus, reason, blocks, metrics, breakEvenSales, goalIndicators]
      properties:
        branchId: { type: string }
        name: { type: string }
        active: { type: boolean }
        temporal: { type: string, enum: [EXPECTED, NOT_STARTED, INACTIVE_WITHOUT_HISTORY] }
        eerrId: { type: [string, 'null'] }
        revision: { type: [integer, 'null'] }
        loadStatus: { type: [string, 'null'] }
        analysisStatus: { type: string, enum: [COMPLETE, PARTIAL, PENDING, EMPTY, UNINITIALIZED, NO_EERR, EXCLUDED] }
        reason: { type: [string, 'null'] }
        blocks: { type: [array, 'null'], items: { type: object } }
        metrics: { type: [object, 'null'] }
        breakEvenSales: { oneOf: [{ $ref: '#/components/schemas/Metric' }, { type: 'null' }] }
        goalIndicators: { type: [object, 'null'] }
    DashboardResponse:
      type: object
      required: [year, month, timezone, calculationVersion, scope, coverage, consolidated, branches, sources, sourceSignature]
      properties:
        year: { type: integer }
        month: { type: integer }
        timezone: { type: string, const: America/Argentina/Buenos_Aires }
        calculationVersion: { type: integer, const: 3 }
        scope: { $ref: '#/components/schemas/Scope' }
        coverage: { $ref: '#/components/schemas/Coverage' }
        consolidated: { $ref: '#/components/schemas/Consolidated' }
        branches: { type: array, items: { $ref: '#/components/schemas/Branch' } }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        sourceSignature: { type: string }
    ComparisonMetric:
      type: object
      required: [current, reference, absoluteDifference, percentagePointDifference, relativeVariation, unit, status, reason]
      properties:
        current: { type: [string, 'null'] }
        reference: { type: [string, 'null'] }
        absoluteDifference: { type: [string, 'null'] }
        percentagePointDifference: { type: [string, 'null'] }
        relativeVariation: { type: [string, 'null'] }
        unit: { type: string, enum: [ARS, PERCENT] }
        status: { type: string, enum: [COMPLETE, BLOCKED, NOT_CALCULABLE] }
        reason: { type: [string, 'null'] }
    ComparisonSide:
      type: object
      required: [period, coverage, consolidated, invalidSources, sources, sourceSignature]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        coverage: { $ref: '#/components/schemas/Coverage' }
        consolidated: { $ref: '#/components/schemas/Consolidated' }
        invalidSources: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        sourceSignature: { type: string }
    ConsolidatedComparison:
      description: Contrato actual v3. Respuestas históricas v2 pueden omitir goalComparison y los campos de simulación de cada lado; la comparación financiera se conserva.
      type: object
      required: [orientation, timezone, current, reference, scope, calculationVersion, population, metrics, goalComparison]
      properties:
        orientation: { type: string, const: CURRENT_MINUS_REFERENCE }
        timezone: { type: string, const: America/Argentina/Buenos_Aires }
        current: { $ref: '#/components/schemas/ComparisonSide' }
        reference: { $ref: '#/components/schemas/ComparisonSide' }
        scope: { $ref: '#/components/schemas/Scope' }
        calculationVersion: { type: integer, const: 3 }
        population:
          type: object
          required: [inBoth, onlyCurrent, onlyReference, changedExistence, changedCompleteness]
          properties:
            inBoth: { type: array, items: { type: string } }
            onlyCurrent: { type: array, items: { type: string } }
            onlyReference: { type: array, items: { type: string } }
            changedExistence: { type: array, items: { type: string } }
            changedCompleteness: { type: array, items: { type: string } }
        metrics:
          type: object
          required: [income, costs, grossMargin, grossMarginPercent, expenses, netResult, netResultPercent, breakEvenSales]
          additionalProperties: false
          properties:
            income: { $ref: '#/components/schemas/ComparisonMetric' }
            costs: { $ref: '#/components/schemas/ComparisonMetric' }
            grossMargin: { $ref: '#/components/schemas/ComparisonMetric' }
            grossMarginPercent: { $ref: '#/components/schemas/ComparisonMetric' }
            expenses: { $ref: '#/components/schemas/ComparisonMetric' }
            netResult: { $ref: '#/components/schemas/ComparisonMetric' }
            netResultPercent: { $ref: '#/components/schemas/ComparisonMetric' }
            breakEvenSales: { $ref: '#/components/schemas/ComparisonMetric' }
        goalComparison:
          type: object
          required: [targetSales, targetDifference, targetCompliance]
          additionalProperties: false
          properties:
            targetSales: { $ref: '#/components/schemas/ComparisonMetric' }
            targetDifference: { $ref: '#/components/schemas/ComparisonMetric' }
            targetCompliance: { $ref: '#/components/schemas/ComparisonMetric' }
